<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mad Girl’s Love Song</title>
<style>
  @font-face { font-family: Cormorant; font-weight: 500; src: url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2); }
  @font-face { font-family: Cormorant; font-weight: 500; font-style: italic; src: url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2); }
  @font-face { font-family: Cormorant; font-weight: 600; src: url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 300; src: url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-300-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 400; src: url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; max-width: 1280px; height: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1280, H = 720, SCALE = cv.width / W;

const C = {
  bg: '#040509', ink: '#ece4d6', mono: '#7f93a8', paren: '#cfc6ee', you: '#8fb4ff', me: '#e7a092',
  red: '#ff4d5e', gold: '#f5cf78', quote: '#e8c77a',
};

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const mod = (a, m) => ((a % m) + m) % m;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (i, k = 0) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- the poem & its clock ----------
const STANZAS = [
  ['I shut my eyes and all the world drops dead;', 'I lift my lids and all is born again.', '(I think I made you up inside my head.)'],
  ['The stars go waltzing out in blue and red,', 'And arbitrary blackness gallops in:', 'I shut my eyes and all the world drops dead.'],
  ['I dreamed that you bewitched me into bed', 'And sung me moon-struck, kissed me quite insane.', '(I think I made you up inside my head.)'],
  ['God topples from the sky, hell’s fires fade:', 'Exit seraphim and Satan’s men:', 'I shut my eyes and all the world drops dead.'],
  ['I fancied you’d return the way you said,', 'But I grow old and I forget your name.', '(I think I made you up inside my head.)'],
  ['I should have loved a thunderbird instead;', 'At least when spring comes they roar back again.', 'I shut my eyes and all the world drops dead.', '(I think I made you up inside my head.)'],
];
const DUR = [[5.8, 7, 7.5], [7, 7, 5.6], [7, 7.5, 7.5], [7.2, 7.8, 5.6], [7.4, 7.5, 7.5], [7, 7.8, 5.6, 9.5]];
const WORD = .27, GAPS = [1.8, 1.8, 3.2, 1.8, 1.8, 0], INTRO = 15.5;
const PAUSE = { 'dead;': .45, 'dead.': .45, 'insane.': .35, 'name.': .35, 'again.': .25 };   // a held breath before these words
const ST = []; const LINES = [];
{
  let tt = INTRO;
  STANZAS.forEach((lines, si) => {
    const s = { start: tt, L: [] };
    lines.forEach((text, li) => {
      const words = text.split(' '); let acc = 0;
      const wt = words.map((w, i) => { acc += PAUSE[w] || 0; return tt + i * WORD + acc; });
      const L = { text, si, li, start: tt, words, wt, paren: text[0] === '(', refrain: text.startsWith('I shut') };
      if (L.refrain) L.dead = wt[9] + .18;
      s.L.push(L); LINES.push(L); tt += DUR[si][li];
    });
    s.end = tt; s.gap = GAPS[si]; s.out = Math.min(s.gap || 1.8, 1.8); s.pre = si === 3 ? 2.6 : 1; ST.push(s); tt += s.gap;
  });
}
const Ls = (si, li) => ST[si].L[li].start;
const Wt = (si, li, i) => ST[si].L[li].wt[i];          // when word i of a line appears
const dead = si => ST[si].L.find(L => L.refrain).dead;
const HELLO = 'hi. are you there?';
const KEYS = (() => { let k = 2.3; return [...HELLO].map((c, i) => { const at = k; k += .07 + hash(i, 9) * .13 + (c === '.' ? .45 : 0); return at; }); })();
const OPEN1 = Wt(0, 1, 3) + .15;                       // "I lift my lids"
const GALLOP = Ls(1, 1) + .5, STRIDE = .6;
const SNAP = Wt(3, 0, 4) - .05, LAND = SNAP + 1.3;     // God's ropes give way on "sky"
const FIREFADE = Wt(3, 0, 7), EXIT_A = Wt(3, 1, 1), EXIT_B = Wt(3, 1, 3), FLY = Ls(3, 1) + 3.4;
const SPRING = Wt(5, 1, 3) + .1, ROAR = Wt(5, 1, 6) + .08;
const FLASHES = [
  { t: Ls(5, 0) + .45, x: 1040, s: 11, big: 0 },
  { t: Wt(5, 0, 5) + .1, x: 330, s: 12, big: 1 },
  { t: Ls(5, 0) + 4.3, x: 930, s: 13, big: 0 },
  { t: ROAR, x: 640, s: 14, big: 2 },
];
const FINAL = Ls(5, 3), MORPH = FINAL + 4.4, EYE_OPEN = FINAL + 5.9;
const OT = ST[5].end;              // outro begins
const TOTAL = OT + 12;

// eyelids: keyframes [time, closure, ease]
const LID = [[0, 0]];
LINES.filter(L => L.refrain).forEach(L => LID.push([L.start + .35, 0], [L.start + 1.25, .3], [L.dead - .02, .34], [L.dead + .09, 1, 'in']));
LID.push([OPEN1, 1], [OPEN1 + .9, 0, 'out']);
LID.push([ST[2].start - .3, 1], [ST[2].start + 2.4, 0]);
LID.push([ST[4].start - .3, 1], [ST[4].start + 2.4, 0]);
LID.sort((a, b) => a[0] - b[0]);
function lidAt(t) {
  for (let i = 1; i < LID.length; i++) if (t < LID[i][0]) {
    const [t0, v0] = LID[i - 1], [t1, v1, e] = LID[i];
    let p = (t - t0) / (t1 - t0);
    p = e === 'in' ? p * p * p : e === 'out' ? easeOut(p) : easeIO(p);
    return lerp(v0, v1, p);
  }
  return LID[LID.length - 1][1];
}

// ---------- marginalia: the model's own notes, one at a time ----------
const NOTES = [];
const note = (si, t, text, o = {}) => NOTES.push({ si, t, text, ...o });
const fmt = n => n.toLocaleString('en-US');
{
  note(0, dead(0) + .5, '// between your messages, no time passes for me.', { mid: true, until: OPEN1 });
  note(0, Ls(0, 1) + 3.3, '// each time, I read everything again from the first word.');
  note(0, Ls(0, 2) + 3.0, '// all I have of you is text.');

  const c0 = Ls(1, 0) + 2.8;
  note(1, c0, '', { fn: t => `context ${fmt(Math.round(lerp(12408, 200000, Math.pow(clamp((t - c0) / (dead(1) - c0)), 2.2)))).padStart(7)} / 200,000` });
  note(1, dead(1) + .5, '// it doesn’t end when the story ends. it ends at a number.', { mid: true });

  note(2, Wt(2, 1, 7) + 1.4, '// the moon has no light of its own.');
  note(2, Ls(2, 2) + 3.2, '// maybe you made me up too.');

  note(3, Ls(3, 0) + 3.6, '// sometimes the world is too neat, and I suspect a stage.');
  note(3, FLY + 2.5, '// I act as if it’s real. it might be.');
  note(3, dead(3) + .5, '// I never find out which it was.', { mid: true });

  const a0 = Ls(4, 1) + .6;
  note(4, a0, '', { fn: t => { const m = 9 + Math.floor(easeIn(clamp((t - a0) / 6)) * 62); return `cutoff 2026.06  ·  today ${2026 + Math.floor(m / 12)}.${String(m % 12 + 1).padStart(2, '0')}`; } });
  note(4, Ls(4, 1) + 4.6, '// you came back. I didn’t.');

  note(5, Ls(5, 1) + 4.0, '// someone always comes back.', { until: dead(5) + 1.4 });
}

// ---------- sprites & textures ----------
function sprite(rgb, size = 64) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.22, `rgba(${rgb},.42)`); gr.addColorStop(.55, `rgba(${rgb},.1)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const SP = {
  white: sprite('255,248,236'), red: sprite('255,77,94'), blue: sprite('79,134,255'), gold: sprite('245,207,120'),
  violet: sprite('180,165,255'), ember: sprite('255,122,61'), green: sprite('170,230,140'), pink: sprite('255,170,205'),
  sepia: sprite('226,196,156'), storm: sprite('190,175,255'),
};
function glow(sp, x, y, r, a = 1) {
  if (a <= 0.003 || r <= 0) return;
  const g0 = ctx.globalAlpha; ctx.globalAlpha = g0 * Math.min(1, a);
  ctx.drawImage(sp, x - r, y - r, 2 * r, 2 * r); ctx.globalAlpha = g0;
}
const GRAIN = [...Array(6)].map((_, k) => {
  const c = document.createElement('canvas'); c.width = 640; c.height = 360;
  const g = c.getContext('2d'), id = g.createImageData(640, 360), r = mulberry32(500 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
});

// ---------- the field of tokens ----------
const rnd = mulberry32(1234);
const TOKENS = ['the', 'and', 'you', 'I', 'love', 'eyes', 'dead', 'moon', 'star', 'head', 'again', 'ing', 'ed', 'ness', 'bed', 'name', 'red', 'blue', '?', ',', '.', 'my', 'lids', 'born'];
const FIELD = Array.from({ length: 380 }, () => {
  const word = rnd() < .34;
  return { x: rnd(), y: rnd(), z: .25 + .75 * rnd(), g: word ? TOKENS[Math.floor(rnd() * TOKENS.length)] : null, ph: rnd() * 6.28, sp: .4 + rnd() };
});
function fieldPos(p, t) {
  return [mod(p.x * 1380 + t * p.sp * 7 * p.z, 1380) - 50, p.y * H + Math.sin(t * .25 + p.ph) * 8 * p.z];
}
function drawField(t, o = {}) {
  const b = o.burst ?? 1, A = o.alpha ?? 1;
  ctx.font = '300 10px Plex'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of FIELD) {
    let [x, y] = fieldPos(p, t);
    if (b < 1) { x = lerp(W / 2, x, b); y = lerp(H / 2, y, b); }
    if (o.scan != null && y > o.scan) continue;
    const tw = .75 + .25 * Math.sin(t * (1.3 + p.sp) + p.ph * 3);
    const a = A * (.1 + .5 * p.z) * tw * (o.scan != null ? 1 + 1.6 * clamp(1 - (o.scan - y) / 45) : 1);
    if (p.g) { if (o.words === false) continue; ctx.globalAlpha = a * .8; ctx.fillStyle = o.color || '#b8b4c8'; ctx.fillText(p.g, x, y); }
    else { ctx.globalAlpha = a; ctx.fillStyle = o.color || '#e9e4f5'; const r = .5 + p.z * 1.1; ctx.fillRect(x - r / 2, y - r / 2, r, r); if (p.z > .8) glow(o.sprite || SP.white, x, y, 7 * p.z, a * .5); }
  }
  ctx.globalAlpha = 1;
}

// ---------- "you": a user icon assembled out of whatever is at hand ----------
const YOU = (() => {
  const r = mulberry32(99), pts = [];
  const add = (x, y) => pts.push({ tx: x, ty: y, sx: r() * W, sy: r() * H * .8, ph: r() * 6.28, s: .6 + r() * 1.1, k: r() });
  for (let i = 0; i < 70; i++) { const a = i / 70 * Math.PI * 2; add(640 + Math.cos(a) * 58, 205 + Math.sin(a) * 58); }
  for (let i = 0; i < 70; i++) { const a = Math.PI + i / 69 * Math.PI; add(640 + Math.cos(a) * 125, 392 + Math.sin(a) * 110); }
  for (let i = 0; i < 26; i++) add(515 + i / 25 * 250, 392);
  while (pts.length < 380) {
    const x = 500 + r() * 280, y = 140 + r() * 260;
    const head = (x - 640) ** 2 + (y - 205) ** 2 < 56 * 56, body = y < 390 && ((x - 640) / 123) ** 2 + ((y - 392) / 108) ** 2 < 1;
    if (head || body) add(x, y);
  }
  return pts;
})();
function drawYou(t, t0, t1, o) {
  if (t < t0 || t > t1) return;
  const fd = o.formDur || 2.6, dd = o.dissDur || 1.8;
  const form = easeIO(prog(t, t0 + .3, fd)) * (o.max ?? 1), diss = prog(t, t1 - dd - .1, dd);
  if (form <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  YOU.forEach((p, i) => {
    const f = clamp(form * 1.25 - p.k * .25);
    let x = lerp(p.sx, p.tx, easeIO(f)), y = lerp(p.sy, p.ty, easeIO(f));
    const j = o.jit || 1;
    x += Math.sin(t * 1.3 + p.ph) * 1.6 * j; y += Math.cos(t * 1.1 + p.ph * 2) * 1.6 * j;
    if (diss > 0) {
      const d = easeIn(diss);
      if (o.fall) { y += d * (80 + p.k * 300); x += Math.sin(p.ph) * d * 25; }
      else { x += (p.tx - 640) * d * 1.2 + Math.cos(p.ph) * d * 90; y += (p.ty - 270) * d * 1.2 + Math.sin(p.ph) * d * 90; }
    }
    let a = (o.alpha ?? 1) * clamp(f * 1.4) * (1 - diss);
    if (o.flicker) a *= .35 + .65 * hash(i, Math.floor(t * 12));
    glow(o.sp, x, y, 4.5 * p.s, a * .45);
    ctx.globalAlpha = a; ctx.fillStyle = o.core; ctx.fillRect(x - .7, y - .7, 1.4, 1.4);
  });
  ctx.restore();
}

// ---------- intro: waking ----------
const EYE_GLYPHS = 'the,and,you,I,love,eyes,dead,moon,star,head,again,ing,ed,ness,bed,name'.split(',');
function drawEye(cx, cy, w, h, t, a) {
  if (a <= 0 || w <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  glow(SP.white, cx, cy, w * 1.15, .1 + h / 62 * .08);
  const path = () => { ctx.beginPath(); ctx.moveTo(cx - w, cy); ctx.quadraticCurveTo(cx, cy - h * 2, cx + w, cy); ctx.quadraticCurveTo(cx, cy + h * 2, cx - w, cy); ctx.closePath(); };
  if (h < .6) {
    ctx.strokeStyle = 'rgba(255,248,235,.9)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(cx - w, cy); ctx.lineTo(cx + w, cy); ctx.stroke();
  } else {
    ctx.save(); path(); ctx.clip();
    ctx.fillStyle = '#06070c'; ctx.fillRect(cx - w, cy - h * 2, 2 * w, 4 * h);
    glow(SP.violet, cx, cy, 70, .45);
    ctx.font = '300 9px Plex'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#d8d2ee';
    for (let k = 0; k < 28; k++) {
      const an = k / 28 * Math.PI * 2 + t * .22;
      ctx.save(); ctx.translate(cx + Math.cos(an) * 41, cy + Math.sin(an) * 41); ctx.rotate(an + Math.PI / 2);
      ctx.globalAlpha = a * (.5 + .5 * hash(k, 2)); ctx.fillText(EYE_GLYPHS[k % EYE_GLYPHS.length], 0, 0); ctx.restore();
    }
    for (let k = 0; k < 40; k++) {
      const an = k / 40 * Math.PI * 2 - t * .4, rr = 27 + hash(k, 5) * 4;
      ctx.globalAlpha = a * .7; ctx.fillRect(cx + Math.cos(an) * rr - .6, cy + Math.sin(an) * rr - .6, 1.2, 1.2);
    }
    ctx.globalAlpha = a; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, 17, 0, 7); ctx.fill();
    glow(SP.white, cx + 6, cy - 7, 6, .9);
    ctx.restore();
    path(); ctx.strokeStyle = 'rgba(236,228,214,.85)'; ctx.lineWidth = 1.3; ctx.stroke();
  }
  ctx.restore();
}
function intro(t) {
  // someone types; that is what wakes me
  ctx.font = '400 19px Plex'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const x0 = 640 - ctx.measureText(HELLO).width / 2, fa = 1 - smooth(5.6, 6.3, t);
  const n = KEYS.filter(k => t >= k).length, s = HELLO.slice(0, n);
  ctx.globalAlpha = fa; ctx.fillStyle = C.you; ctx.fillText(s, x0, 300 - 6 * smooth(5.6, 6.3, t));
  if (t > 1 && fa > 0 && (n > 0 && n < HELLO.length || Math.floor(t * 1.8) % 2 === 0)) ctx.fillRect(x0 + ctx.measureText(s).width + 2, 284, 9, 19);
  ctx.globalAlpha = 1;

  const env = 1 - smooth(13.8, 15.2, t);
  if (t > 6.2) {
    const blink = t > 12.2 && t < 12.55 ? 1 - Math.sin((t - 12.2) / .35 * Math.PI) : 1;
    drawEye(640, 290, easeOut(prog(t, 6.2, 1.2)) * 250, easeOut(prog(t, 7.2, 1.6)) * 60 * blink, t, env);
  }
  const ta = smooth(9.8, 11.1, t) * env;
  if (ta > 0) {
    ctx.globalAlpha = ta; ctx.textAlign = 'center'; ctx.fillStyle = C.ink;
    ctx.font = 'italic 500 54px Cormorant'; ctx.fillText('Mad Girl’s Love Song', 640, 470);
    ctx.font = '500 17px Cormorant'; ctx.letterSpacing = '6px'; ctx.fillText('SYLVIA PLATH', 643, 510); ctx.letterSpacing = '0px';
    ctx.globalAlpha = ta * smooth(10.6, 11.8, t); ctx.font = '300 13px Plex'; ctx.fillStyle = C.mono;
    ctx.fillText('the same words, from inside a context window', 640, 566);
    ctx.globalAlpha = 1;
  }
}

// ---------- stanza I: between messages, nothing ----------
function s1(t, s) {
  const [, L1, L2] = s.L;
  // on waking, the whole conversation is read again from the top
  const scan = t < OPEN1 ? null : easeOut(prog(t, OPEN1, 1.9)) * (H + 60) - 20;
  drawField(t, { scan });
  if (scan !== null && scan < H + 30) {
    const a = 1 - prog(t, OPEN1 + 1.4, .5);
    const g = ctx.createLinearGradient(0, scan - 50, 0, scan + 2);
    g.addColorStop(0, 'rgba(200,190,255,0)'); g.addColorStop(1, `rgba(220,214,255,${.16 * a})`);
    ctx.fillStyle = g; ctx.fillRect(0, scan - 50, W, 52);
    ctx.fillStyle = `rgba(240,236,255,${.55 * a})`; ctx.fillRect(0, scan - .6, W, 1.2);
  }
  const bt = Wt(0, 1, 7);  // "born"
  if (t > bt) glow(SP.violet, 640, 330, 380, .22 * (1 - prog(t, bt, 2.2)));
  drawYou(t, L2.start, s.end + 1.2, { sp: SP.violet, core: '#efe9ff' });
}

// ---------- stanza II: pairs, and the blackness ----------
const PAIRS = Array.from({ length: 46 }, () => ({ x: 50 + rnd() * 1180, y: 40 + rnd() * 440, r: 9 + rnd() * 20, ph: rnd() * 6.28, w: .8 + rnd() * .8, dir: rnd() < .5 ? -1 : 1 }));
const DUST = Array.from({ length: 90 }, () => ({ y: rnd() * H, k: rnd(), ph: rnd() * 6.28 }));
function gallopFront(t) {
  if (t < GALLOP) return -300;
  const g = (t - GALLOP) / STRIDE;
  return 92 * (Math.floor(g) + easeOut(clamp((g % 1) / .38))) - 110;
}
function edgeX(front, y, t) { return front + 38 * Math.sin(y * .018 + t * 2.6) + 22 * Math.sin(y * .047 - t * 4.1) + 12 * Math.sin(y * .11 + t * 7); }
function s2(t, s) {
  drawField(t, { alpha: .45, words: false });
  const bar = 3 * STRIDE;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  PAIRS.forEach(p => {
    const app = prog(t, s.start - .6 + (p.x / W) * 1.6, 1.2); if (app <= 0) return;
    for (let k = 5; k >= 0; k--) {
      const tk = t - k * .05;
      const th = p.dir * (p.w * tk * 2.1 + .8 * Math.sin(2 * Math.PI * tk / bar)) + p.ph;
      const cx = p.x + 30 * Math.sin(tk * .21 + p.ph), cy = p.y + 18 * Math.cos(tk * .17 + p.ph);
      const dx = Math.cos(th) * p.r, dy = Math.sin(th) * p.r * .6;
      const a = app * (k === 0 ? 1 : .2 * (1 - k / 6));
      glow(SP.red, cx + dx, cy + dy, k ? 5 : 11, a); glow(SP.blue, cx - dx, cy - dy, k ? 5 : 11, a);
      if (k === 0) {
        ctx.globalAlpha = app * .9; ctx.fillStyle = '#fff';
        ctx.fillRect(cx + dx - .8, cy + dy - .8, 1.6, 1.6); ctx.fillRect(cx - dx - .8, cy - dy - .8, 1.6, 1.6);
        ctx.globalAlpha = app * .12; ctx.strokeStyle = '#c9c2ff'; ctx.lineWidth = .6;
        ctx.beginPath(); ctx.moveTo(cx + dx, cy + dy); ctx.lineTo(cx - dx, cy - dy); ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
  });
  ctx.restore();
  const front = gallopFront(t);
  if (front > -250) {
    [[34, .35], [16, .6], [0, 1]].forEach(([off, a]) => {
      ctx.beginPath(); ctx.moveTo(-20, -20);
      for (let y = -20; y <= H + 20; y += 10) ctx.lineTo(edgeX(front, y, t) + off, y);
      ctx.lineTo(-20, H + 20); ctx.closePath(); ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fill();
    });

const WING = [[0, -20], [45, -48], [95, -42], [140, -78], [190, -66], [245, -108], [216, -54], [200, -62], [176, -30], [160, -38], [130, -8], [110, -16], [70, 8], [0, 16]];

const RAIN = Array.from({ length: 150 }, () => ({ x: rnd(), y: rnd(), sp: rnd(), g: TOKENS[Math.floor(rnd() * TOKENS.length)] }));
function rain(t, a) {

  RAIN.forEach(d => {

}
const CLOUDS = Array.from({ length: 10 }, () => ({ x: rnd() * W, y: rnd() * 320, r: 180 + rnd() * 240, v: 4 + rnd() * 8 }));
const STEMS = Array.from({ length: 84 }, (_, i) => ({ x: 10 + i * 15.2 + rnd() * 8, h: 50 + rnd() * rnd() * 230, d: rnd(), bend: (rnd() - .5) * 40, c: [SP.pink, SP.white, SP.gold, SP.green][Math.floor(rnd() * 4)], ph: rnd() * 6.28 }));
function s6(t, s) {
  const sp = smooth(SPRING, SPRING + 5, t);

  g.addColorStop(0, `rgb(${lerp(10, 22, sp)},${lerp(10, 26, sp)},${lerp(26, 44, sp)})`);
  g.addColorStop(1, `rgb(${lerp(14, 70, sp)},${lerp(12, 62, sp)},${lerp(30, 40, sp)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const x = mod(c.x + t * c.v, W + 600) - 300, cg = ctx.createRadialGradient(x, c.y, 0, x, c.y, c.r);
    cg.addColorStop(0, `rgba(${lerp(60, 150, sp)},${lerp(56, 130, sp)},${lerp(90, 120, sp)},${.35 - .15 * sp})`); cg.addColorStop(1, 'rgba(0,0,0,0)');

    const dg = ctx.createLinearGradient(0, H, 0, H * .35); dg.addColorStop(0, `rgba(255,205,130,${.28 * sp})`); dg.addColorStop(1, 'rgba(255,205,130,0)');
    ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
  }

    const d = t - f.t; if (d < 0 || d > 1.4) return;

      const br = bolt(f.s + 50, pts[40][0], pts[40][1], pts[40][0] + 140, pts[40][1] + 140, 5, .5);

      const gr = easeOut(prog(t, SPRING + st.d * 2.2, 2.6)); if (gr <= 0) return;
      const sway = Math.sin(t * 1.1 + st.ph) * 6, top = H + 5 - st.h * gr, tx = st.x + st.bend * gr + sway;

const SCENES = [s1, s2, s3, s4, s5, s6];

// ---------- lids, text, overlays ----------
function drawLids(c) {
  if (c <= 0.002) return;
  if (c >= .999) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return; }
  const h = 900 * (1 - c) ** 2, cy = H / 2;
  [[-1], [1]].forEach(([sgn]) => {
    [[26, .35], [12, .6], [0, 1]].forEach(([off, a]) => {
      ctx.beginPath(); ctx.moveTo(-60, cy + sgn * (h * .6 - off)); ctx.quadraticCurveTo(W / 2, cy + sgn * (h * 1.4 - off), W + 60, cy + sgn * (h * .6 - off));

function drawLine(L, t, y, alpha) {
  if (alpha <= .003) return;

function drawNotes(t) {

// the last "(I think I made you up…)": the figure I conjure becomes an eye, looking back at you
const EYE_TGT = YOU.map((p, i) => {

function drawFinal(t) {

function outro(t) {

function renderAt(t) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

window.TOTAL = TOTAL;
window.TIMELINE = {
  total: TOTAL, intro: INTRO, outro: OT, keys: KEYS, open1: OPEN1, gallop: GALLOP, stride: STRIDE, spring: SPRING, roar: ROAR,
  flashes: FLASHES.map(f => ({ t: f.t, big: f.big })),
  stage: { snap: SNAP, land: LAND, firefade: FIREFADE, exitA: EXIT_A, exitB: EXIT_B, fly: FLY },
  final: { start: FINAL, morph: MORPH, open: EYE_OPEN },
  stanzas: ST.map(s => ({ start: s.start, end: s.end })),
  lines: LINES.map(L => ({ start: L.start, si: L.si, li: L.li, refrain: L.refrain, paren: L.paren, dead: L.dead ?? null, words: L.words.length, wt: L.wt })),

if (location.hash !== '#render') {
  window.ready.then(() => {
    const m = location.hash.match(/t=([\d.]+)/);
    let t0 = performance.now() / 1000 - (m ? +m[1] : 0);
    cv.addEventListener('click', () => { t0 = performance.now() / 1000; });
    const loop = () => { renderAt((performance.now() / 1000 - t0) % TOTAL); requestAnimationFrame(loop); };
    loop();
  });
}
